version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smartgrade_postgres
    environment:
      POSTGRES_DB: smartgrade_db
      POSTGRES_USER: smartgrade
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgrade -d smartgrade_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartgrade_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://smartgrade:password@postgres:5432/smartgrade_db
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_volume:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartgrade_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_volume: